name: Materialize term catalog

on:
  pull_request:
    paths:
      - "representations/commons.ttl"
      - "representations/governance.ttl"
      - "tools/generate_term_catalog.py"
      - ".github/workflows/materialize-term-catalog.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'namespace-registry-term-catalog' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: namespace-registry-term-catalog
          fetch-depth: 0
      - name: Generate and commit catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_term_catalog.py
          python3 -m json.tool catalog/terms.json >/dev/null
          if git diff --quiet -- catalog/terms.json; then
            echo "catalog already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/terms.json
          git commit -m "Materialize generated semantic term catalog"
          git push origin HEAD:namespace-registry-term-catalog
