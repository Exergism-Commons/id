name: Runtime Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.classify.outputs.authorized }}
      concurrency_group: ${{ steps.classify.outputs.concurrency_group }}
      release_channel: ${{ steps.classify.outputs.release_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        name: Classify exact ref and freshness
        shell: bash
        run: |
          set -euo pipefail

          authorized=false
          concurrency_group="runtime-release-invalid-${GITHUB_RUN_ID}"
          release_channel="invalid"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            git fetch --no-tags --force origin \
              refs/heads/main:refs/remotes/origin/main
            remote_main="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$GITHUB_SHA" == "$remote_main" ]]; then
              authorized=true
              # Different main SHAs deliberately do not share this queue:
              # GitHub may replace pending members. Destination-level mutation
              # is serialized later by an atomic repository lock ref.
              concurrency_group="runtime-release-main-${GITHUB_SHA}"
              release_channel="runtime-main"
            else
              echo "Refusing stale runtime-main run: $GITHUB_SHA != current main $remote_main" >&2
            fi
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            authorized=true
            tag_identity="$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | awk '{print $1}')"
            concurrency_group="runtime-release-tag-${tag_identity}"
            release_channel="$GITHUB_REF_NAME"
          else
            echo "Refusing unauthorized runtime release ref: $GITHUB_REF" >&2
          fi

          printf 'authorized=%s\n' "$authorized" >> "$GITHUB_OUTPUT"
          printf 'concurrency_group=%s\n' "$concurrency_group" >> "$GITHUB_OUTPUT"
          printf 'release_channel=%s\n' "$release_channel" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: classify
    if: needs.classify.outputs.authorized == 'true'
    concurrency:
      group: ${{ needs.classify.outputs.concurrency_group }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - name: Verify committed semantic discovery catalog
        run: python3 tools/generate_term_catalog.py --check

      - name: Test resolver
        run: |
          set -euo pipefail
          go version
          go test ./...
          go vet ./...

      - name: Build Linux runtime assets
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.classify.outputs.release_channel }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w -buildid=' \
              -o "dist/idresolver-linux-${arch}" ./cmd/idresolver
          done

          (
            cd dist
            sha256sum idresolver-linux-amd64 idresolver-linux-arm64 > SHA256SUMS
          )
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT

          [[ "$RELEASE_CHANNEL" == "runtime-main" || "$RELEASE_CHANNEL" == v* ]] || {
            echo "Classifier returned invalid release channel: $RELEASE_CHANNEL" >&2
            exit 1
          }

          python3 - "$GITHUB_REPOSITORY" "$RELEASE_CHANNEL" "$GITHUB_SHA" <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib
          import sys

          repository, release_tag, source_commit = sys.argv[1:]
          dist = pathlib.Path("dist")
          assets = {}
          for arch in ("amd64", "arm64"):
              name = f"idresolver-linux-{arch}"
              data = (dist / name).read_bytes()
              assets[arch] = {
                  "name": name,
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              "schema_version": "0.1",
              "repository": repository,
              "release_tag": release_tag,
              "source_commit": source_commit,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "assets": assets,
          }
          (dist / "DEPLOYMENT_MANIFEST.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          python3 - <<'PY'
          import json
          import pathlib
          import re
          m = json.loads(pathlib.Path("dist/DEPLOYMENT_MANIFEST.json").read_text())
          assert m["schema_version"] == "0.1"
          assert m["repository"] == "Exergism-Commons/id"
          assert re.fullmatch(r"[0-9a-f]{40}", m["source_commit"])
          for arch in ("amd64", "arm64"):
              assert re.fullmatch(r"[0-9a-f]{64}", m["assets"][arch]["sha256"])
          PY

          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'deployment_manifest_sha256=%s\n' "$(sha256sum dist/DEPLOYMENT_MANIFEST.json | awk '{print $1}')"
            go version
            go version -m dist/idresolver-linux-amd64
            go version -m dist/idresolver-linux-arm64
          } > dist/BUILD_INFO

      - name: Publish runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.classify.outputs.release_channel }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          lock_ref="refs/tags/runtime-main-publish-lock"
          lock_commit=""
          lock_acquired=0

          release_runtime_main_lock() {
            [[ "$lock_acquired" == 1 && -n "$lock_commit" ]] || return 0
            remote_oid="$(git ls-remote --refs origin "$lock_ref" | awk '{print $1}')"
            if [[ "$remote_oid" == "$lock_commit" ]]; then
              git push \
                --force-with-lease="${lock_ref}:${lock_commit}" \
                origin ":${lock_ref}" >/dev/null 2>&1 || true
            fi
          }

          acquire_runtime_main_lock() {
            local tree holder status remote_oid run_meta http_code reclaim
            tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
            lock_commit="$(printf 'runtime-main-publish-lock run=%s\n' "$GITHUB_RUN_ID" \
              | git commit-tree "$tree" -p "$GITHUB_SHA")"

            for _ in {1..120}; do
              if git push origin "${lock_commit}:${lock_ref}" >/dev/null 2>&1; then
                lock_acquired=1
                return 0
              fi

              remote_oid="$(git ls-remote --refs origin "$lock_ref" | awk '{print $1}')"
              if [[ ! "$remote_oid" =~ ^[0-9a-f]{40}$ ]]; then
                sleep 2
                continue
              fi

              git fetch --no-tags --force origin \
                "${lock_ref}:refs/remotes/origin/runtime-main-publish-lock" >/dev/null 2>&1 || {
                  sleep 2
                  continue
                }
              holder="$(git show -s --format=%B refs/remotes/origin/runtime-main-publish-lock \
                | sed -n 's/^runtime-main-publish-lock run=\([0-9][0-9]*\)$/\1/p' \
                | head -n1)"

              if [[ "$holder" == "$GITHUB_RUN_ID" ]]; then
                # GITHUB_RUN_ID survives "Re-run jobs". Reclaim only the exact
                # lock object observed from an earlier attempt of this run.
                git push \
                  --force-with-lease="${lock_ref}:${remote_oid}" \
                  origin ":${lock_ref}" >/dev/null 2>&1 || true
                sleep 1
                continue
              fi

              if [[ "$holder" =~ ^[0-9]+$ ]]; then
                run_meta="$(mktemp)"
                http_code="$(curl -sS -o "$run_meta" -w '%{http_code}' \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${holder}" || true)"
                reclaim=0
                if [[ "$http_code" == "200" ]]; then
                  status="$(python3 - "$run_meta" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text()).get("status", ""))
          PY
          )"
                  [[ "$status" == "completed" ]] && reclaim=1
                elif [[ "$http_code" == "404" ]]; then
                  # The authenticated same-repository run lookup definitively
                  # no longer resolves. Reclaim only the exact OID we observed;
                  # transient/network/authorization failures never reclaim.
                  reclaim=1
                fi
                rm -f "$run_meta"

                if [[ "$reclaim" == 1 ]]; then
                  git push \
                    --force-with-lease="${lock_ref}:${remote_oid}" \
                    origin ":${lock_ref}" >/dev/null 2>&1 || true
                  sleep 1
                  continue
                fi
              fi
              sleep 2
            done
            return 1
          }

          check_current_main() {
            git fetch --no-tags --force origin \
              refs/heads/main:refs/remotes/origin/main || return 1
            remote_main="$(git rev-parse refs/remotes/origin/main)" || return 1
            [[ "$GITHUB_SHA" == "$remote_main" ]]
          }

          notes_file="$(mktemp)"
          trap 'release_runtime_main_lock; rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          Automated Linux runtime build for Exergism Commons idresolver.

          Source commit: \`${GITHUB_SHA}\`

          \`DEPLOYMENT_MANIFEST.json\` is the authoritative deployment snapshot binding this source revision to each runtime SHA-256. Rolling consumers must capture this manifest first and reject any runtime that does not match it. \`SOURCE_COMMIT\` and \`SHA256SUMS\` are compatibility metadata only.
          EOF

          if [[ "$RELEASE_CHANNEL" == "runtime-main" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "runtime-main may only be published from exact refs/heads/main" >&2
              exit 1
            }

            acquire_runtime_main_lock || {
              echo "Could not acquire runtime-main publication lock" >&2
              exit 1
            }

            check_current_main || {
              echo "Refusing stale runtime-main publication before mutation" >&2
              exit 1
            }

            release_tag="runtime-main"
            release_title="idresolver runtime-main (${GITHUB_SHA::12})"

            # The lock serializes every mutable runtime-main publisher across
            # source SHAs. The manifest is the commit point: after destructive
            # mutation starts, this publisher always completes its coherent
            # generation even if main advances. A newer publisher may replace
            # the whole generation after acquiring this same lock.
            git tag -f "$release_tag" "$GITHUB_SHA"
            git push --force origin "refs/tags/${release_tag}"

            if ! gh release view "$release_tag" >/dev/null 2>&1; then
              gh release create "$release_tag" \
                --verify-tag \
                --title "$release_title" \
                --notes-file "$notes_file" \
                --prerelease
            fi

            gh release upload "$release_tag" \
              dist/idresolver-linux-amd64 \
              dist/idresolver-linux-arm64 \
              dist/SHA256SUMS \
              dist/SOURCE_COMMIT \
              dist/BUILD_INFO \
              --clobber

            if ! check_current_main; then
              echo "main advanced during locked publication; completing this coherent generation before the newer publisher replaces it" >&2
            fi

            gh release upload "$release_tag" dist/DEPLOYMENT_MANIFEST.json --clobber
            gh release edit "$release_tag" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease
          else
            release_tag="$RELEASE_CHANNEL"
            [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "$release_tag" && "$release_tag" == v* ]] || {
              echo "Only exact case-sensitive v* tags may publish versioned runtime releases" >&2
              exit 1
            }

            release_title="idresolver ${release_tag}"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              existing_tag="$(gh release view "$release_tag" --json tagName --jq .tagName)"
              is_draft="$(gh release view "$release_tag" --json isDraft --jq .isDraft)"
              [[ "$existing_tag" == "$release_tag" ]] || {
                echo "Existing release tag identity mismatch; refusing mutation" >&2
                exit 1
              }
              if [[ "$is_draft" == "true" ]]; then
                echo "Removing incomplete draft release ${release_tag} before retry" >&2
                gh release delete "$release_tag" --yes
              else
                echo "Versioned runtime release ${release_tag} already published; refusing mutation" >&2
                exit 1
              fi
            fi

            gh release create "$release_tag" \
              dist/idresolver-linux-amd64 \
              dist/idresolver-linux-arm64 \
              dist/SHA256SUMS \
              dist/SOURCE_COMMIT \
              dist/BUILD_INFO \
              dist/DEPLOYMENT_MANIFEST.json \
              --verify-tag \
              --title "$release_title" \
              --notes-file "$notes_file"
          fi
