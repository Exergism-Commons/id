name: Runtime Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Serialize by publication destination. Unauthorized/manual refs get a unique
# per-run group so they can never cancel a pending runtime-main publisher.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'runtime-release-runtime-main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && format('runtime-release-{0}', github.ref_name)) || format('runtime-release-invalid-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    # A manually dispatched feature branch must never be able to move or
    # republish runtime-main. Tagged releases are limited to the v* family.
    if: github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - name: Verify committed semantic discovery catalog
        run: python3 tools/generate_term_catalog.py --check

      - name: Test resolver
        run: |
          set -euo pipefail
          go version
          go test ./...
          go vet ./...

      - name: Build Linux runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w -buildid=' \
              -o "dist/idresolver-linux-${arch}" ./cmd/idresolver
          done

          (
            cd dist
            sha256sum idresolver-linux-amd64 idresolver-linux-arm64 > SHA256SUMS
          )
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            manifest_release_tag="$GITHUB_REF_NAME"
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "runtime-main may only be built from refs/heads/main" >&2
              exit 1
            }
            manifest_release_tag="runtime-main"
          fi

          python3 - "$GITHUB_REPOSITORY" "$manifest_release_tag" "$GITHUB_SHA" <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib
          import sys

          repository, release_tag, source_commit = sys.argv[1:]
          dist = pathlib.Path("dist")
          assets = {}
          for arch in ("amd64", "arm64"):
              name = f"idresolver-linux-{arch}"
              data = (dist / name).read_bytes()
              assets[arch] = {
                  "name": name,
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              "schema_version": "0.1",
              "repository": repository,
              "release_tag": release_tag,
              "source_commit": source_commit,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "assets": assets,
          }
          (dist / "DEPLOYMENT_MANIFEST.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          python3 - <<'PY'
          import json
          import pathlib
          import re
          m = json.loads(pathlib.Path("dist/DEPLOYMENT_MANIFEST.json").read_text())
          assert m["schema_version"] == "0.1"
          assert m["repository"] == "Exergism-Commons/id"
          assert re.fullmatch(r"[0-9a-f]{40}", m["source_commit"])
          for arch in ("amd64", "arm64"):
              assert re.fullmatch(r"[0-9a-f]{64}", m["assets"][arch]["sha256"])
          PY

          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'deployment_manifest_sha256=%s\n' "$(sha256sum dist/DEPLOYMENT_MANIFEST.json | awk '{print $1}')"
            go version
            go version -m dist/idresolver-linux-amd64
            go version -m dist/idresolver-linux-arm64
          } > dist/BUILD_INFO

      - name: Publish runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            [[ "$release_tag" == v* ]] || {
              echo "Only v* tags may publish tagged runtime releases" >&2
              exit 1
            }
            release_title="idresolver ${release_tag}"
            rolling=0
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "runtime-main may only be published from refs/heads/main" >&2
              exit 1
            }
            release_tag="runtime-main"
            release_title="idresolver runtime-main (${GITHUB_SHA::12})"
            rolling=1

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$release_tag" "$GITHUB_SHA"
            git push --force origin "refs/tags/${release_tag}"
          fi

          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Automated Linux runtime build for Exergism Commons idresolver.

          Source commit: \`${GITHUB_SHA}\`

          \`DEPLOYMENT_MANIFEST.json\` is the atomic deployment snapshot binding this source revision to the SHA-256 digest of each architecture-specific runtime. \`SOURCE_COMMIT\` and \`SHA256SUMS\` remain for bootstrap/backward compatibility, but deployment-attestation agents must trust the single manifest snapshot rather than combining those mutable assets independently.
          EOF

          assets=(
            dist/idresolver-linux-amd64
            dist/idresolver-linux-arm64
            dist/DEPLOYMENT_MANIFEST.json
            dist/SHA256SUMS
            dist/SOURCE_COMMIT
            dist/BUILD_INFO
          )

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
            if [[ "$rolling" == "1" ]]; then
              gh release edit "$release_tag" --title "$release_title" --notes-file "$notes_file" --prerelease
            else
              gh release edit "$release_tag" --title "$release_title" --notes-file "$notes_file"
            fi
          else
            if [[ "$rolling" == "1" ]]; then
              gh release create "$release_tag" "${assets[@]}" --verify-tag --title "$release_title" --notes-file "$notes_file" --prerelease
            else
              gh release create "$release_tag" "${assets[@]}" --verify-tag --title "$release_title" --notes-file "$notes_file"
            fi
          fi

          rm -f "$notes_file"
