name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-resolver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Exergism-Commons/funding
          ref: 46d97c2c754058dead61fec44c7f5addae018e3c
          path: funding-source
          persist-credentials: false
      - name: Install Funding publication tooling
        run: python -m pip install -r funding-source/requirements-ontology.txt
      - name: Verify Funding 0.2 candidate remains unregistered
        run: python3 tools/validate_funding_candidate.py --source-commit 46d97c2c754058dead61fec44c7f5addae018e3c
      - name: Rebuild and compare owner-authored Funding publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/funding-publication
          python funding-source/tools/export_publication.py --output-dir /tmp/funding-publication
          diff -ru /tmp/funding-publication staging/funding/0.2.0-pre1/publication
      - name: Establish trusted persistence boundary
        shell: bash
        env:
          EC_ID_PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "EC_ID_HISTORY_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          else
            echo "EC_ID_HISTORY_BASE=${EC_ID_PUSH_BASE}" >> "$GITHUB_ENV"
          fi
      - name: Enforce persistent resolver history
        run: python3 tools/validate_persistence_history.py
      - name: Verify generated term catalog
        run: python3 tools/generate_term_catalog.py --check
      - run: go version
      - run: go test ./...
      - run: go vet ./...
      - name: Validate deployment bootstrap
        run: bash -n deploy/setup-digitalocean.sh
      - name: Enforce reviewed redistribution surface
        shell: bash
        run: |
          set -euo pipefail
          test -f EULA.md
          test -f THIRD_PARTY_NOTICES.md
          test -f LICENSES/Go.txt
          test -f LICENSES/Apache-2.0.txt
          test ! -f go.sum
          module_count="$(go list -m all | wc -l | tr -d ' ')"
          if [[ "$module_count" != "1" ]]; then
            echo "External Go modules were added. Review licences and update THIRD_PARTY_NOTICES.md before merging." >&2
            go list -m all >&2
            exit 1
          fi
