name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-resolver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Exergism-Commons/funding
          ref: 63f43ab50c1c1312507915993e81b5e3a8d7478c
          path: funding-source
          persist-credentials: false
      - name: Materialize Funding 0.2 candidate once
        if: github.event_name == 'pull_request' && github.head_ref == 'activate-funding-normalization-v0.2' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git checkout activate-funding-normalization-v0.2
          python -m pip install -r funding-source/requirements-ontology.txt
          rm -rf staging/funding/0.2.0-pre1
          python funding-source/tools/export_publication.py --output-dir staging/funding/0.2.0-pre1/publication
          python - <<'PY'
          import json
          from pathlib import Path
          target = Path('staging/funding/0.2.0-pre1/candidate.json')
          target.write_text(json.dumps({
              'schema_version': 1,
              'project': 'funding',
              'publication_version': '0.2.0-pre1',
              'source_repository': 'Exergism-Commons/funding',
              'source_commit': '63f43ab50c1c1312507915993e81b5e3a8d7478c',
              'source_state': 'candidate-pr-head',
              'source_pr': 'https://github.com/Exergism-Commons/funding/pull/8',
              'activation_requires_authoritative_main_commit': True,
              'registered_publicly': False,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/funding/0.2.0-pre1
          if git diff --cached --quiet; then
            echo "candidate projection already materialized"
            exit 0
          fi
          git commit -m "Materialize Funding 0.2 resolver candidate"
          git push origin HEAD:activate-funding-normalization-v0.2
      - name: Establish trusted persistence boundary
        shell: bash
        env:
          EC_ID_PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "EC_ID_HISTORY_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          else
            echo "EC_ID_HISTORY_BASE=${EC_ID_PUSH_BASE}" >> "$GITHUB_ENV"
          fi
      - name: Enforce persistent resolver history
        run: python3 tools/validate_persistence_history.py
      - name: Verify generated term catalog
        run: python3 tools/generate_term_catalog.py --check
      - run: go version
      - run: go test ./...
      - run: go vet ./...
      - name: Validate deployment bootstrap
        run: bash -n deploy/setup-digitalocean.sh
      - name: Enforce reviewed redistribution surface
        shell: bash
        run: |
          set -euo pipefail
          test -f EULA.md
          test -f THIRD_PARTY_NOTICES.md
          test -f LICENSES/Go.txt
          test -f LICENSES/Apache-2.0.txt
          test ! -f go.sum
          module_count="$(go list -m all | wc -l | tr -d ' ')"
          if [[ "$module_count" != "1" ]]; then
            echo "External Go modules were added. Review licences and update THIRD_PARTY_NOTICES.md before merging." >&2
            go list -m all >&2
            exit 1
          fi
