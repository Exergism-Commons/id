name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-resolver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-semantic.txt
      - name: Install semantic catalog audit tooling
        run: python -m pip install -r requirements-semantic.txt
      - name: Establish trusted persistence boundary
        shell: bash
        env:
          EC_ID_PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "EC_ID_HISTORY_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          else
            echo "EC_ID_HISTORY_BASE=${EC_ID_PUSH_BASE}" >> "$GITHUB_ENV"
          fi
      - name: Enforce persistent resolver history
        run: python3 tools/validate_persistence_history.py
      - name: Verify generated term catalog
        run: python3 tools/generate_term_catalog.py --check
      - name: Prove term catalog completeness from parsed RDF
        run: python3 tools/validate_term_catalog_rdf.py
      - run: go version
      - run: go test ./...
      - run: go vet ./...
      - name: Validate deployment bootstraps
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/setup-digitalocean.sh
          bash -n deploy/install-deployment-attestation.sh

      - name: Validate deployment-attestation handoff pins
        shell: bash
        run: |
          set -euo pipefail
          script=deploy/install-deployment-attestation.sh

          grep -Fq 'DA_VERSION="v0.1.1"' "$script"
          grep -Fq 'DA_COMMIT="80c0fa06b8fac71332f0a2fdd5c409e666d91955"' "$script"
          grep -Fq 'DA_MANIFEST_SHA256="5fc66e50b542d0d9c2cf4ffb704f201b1ba58ce91fd5cb005684cae84535495d"' "$script"
          grep -Fq 'DA_INSTALLER_SHA256="14b70c91f6cff93943e4d03dc33bb9c41ab42195e1ab7ff922a0c677f3c8dd2f"' "$script"
          grep -Fq 'DA_AGENT_SHA256="7fbb723a87cc677721b6fdffd78465f0f31d9b6a83784ac1a5d8d7b58b42c5cf"' "$script"
          grep -Fq 'DA_SUMS_SHA256="8918b7b016c0fdf58c2c35fe0219d0b0093793dab7d46849efcae9433d8f5309"' "$script"

          grep -Fq 'sha256sum -c SHA256SUMS' "$script"
          grep -Fq 'EC_INSTALLER_TRUSTED_STAGE="$STAGE"' "$script"
          grep -Fq 'EC_INSTALLER_SOURCE_ROOT="$SOURCE_ROOT"' "$script"
          grep -Fq 'EC_NATIVE_AGENT_SHA256="$DA_AGENT_SHA256"' "$script"
          grep -Fq 'EC_RELEASE_TAG=runtime-main' "$script"
          grep -Fq '"$ARTIFACT_FENCE_AUDITOR"' "$script"
          grep -Fq '"$AGENT" health' "$script"
          ! grep -Eiq 'deployment-attestation/(latest|releases/latest)' "$script"
      - name: Validate runtime release workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/runtime-release.yml
      - name: Validate release recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'EC-Publisher: Exergism-Commons/id/.github/workflows/runtime-release.yml' .github/workflows/runtime-release.yml
          grep -Fq 'EC-Source-Commit: ${GITHUB_SHA}' .github/workflows/runtime-release.yml
          grep -Fq 'release_owner_source()' .github/workflows/runtime-release.yml
          grep -Fq 'validate_published_release_manifest()' .github/workflows/runtime-release.yml
          grep -Fq 'Removing stale/incomplete owned published release' .github/workflows/runtime-release.yml
          grep -Fq 'runtime_main_mutation_marker_matches()' .github/workflows/runtime-release.yml
          grep -Fq 'runtime_main_tag_matches_source()' .github/workflows/runtime-release.yml
          grep -Fq 'write_runtime_main_mutation_marker' .github/workflows/runtime-release.yml
          grep -Fq 'Reusing existing runtime-main mutation marker' .github/workflows/runtime-release.yml
          grep -Fq -- '--force-with-lease="${marker_ref}:"' .github/workflows/runtime-release.yml
          grep -Fq 'runtime_main_mutation_marker_matches' .github/workflows/runtime-release.yml
          grep -Fq 'clear_runtime_main_mutation_marker' .github/workflows/runtime-release.yml
          grep -Fq 'Admitting stale exact-main rerun for locked recovery decision' .github/workflows/runtime-release.yml
          grep -Fq 'concurrency_group="runtime-release-main-${GITHUB_SHA}-${GITHUB_RUN_ID}"' .github/workflows/runtime-release.yml
      - name: Enforce reviewed redistribution surface
        shell: bash
        run: |
          set -euo pipefail
          test -f EULA.md
          test -f THIRD_PARTY_NOTICES.md
          test -f LICENSES/Go.txt
          test -f LICENSES/Apache-2.0.txt
          test ! -f go.sum
          module_count="$(go list -m all | wc -l | tr -d ' ')"
          if [[ "$module_count" != "1" ]]; then
            echo "External Go modules were added. Review licences and update THIRD_PARTY_NOTICES.md before merging." >&2
            go list -m all >&2
            exit 1
          fi
