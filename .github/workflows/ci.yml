name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go version
      - run: go test ./...
      - run: go vet ./...
      - name: Validate deployment bootstrap
        run: bash -n deploy/setup-digitalocean.sh
      - name: Enforce reviewed redistribution surface
        shell: bash
        run: |
          set -euo pipefail
          test -f EULA.md
          test -f THIRD_PARTY_NOTICES.md
          test -f LICENSES/Go.txt
          test -f LICENSES/Apache-2.0.txt
          test ! -f go.sum
          module_count="$(go list -m all | wc -l | tr -d ' ')"
          if [[ "$module_count" != "1" ]]; then
            echo "External Go modules were added. Review licences and update THIRD_PARTY_NOTICES.md before merging." >&2
            go list -m all >&2
            exit 1
          fi
